<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #content {
            width: 499px;
            margin: 30px auto;
            position: relative;
            border: 10px solid rgb(35, 44, 144);
            border-radius: 30px;
            overflow: hidden;
            background-color: white;

            display: grid;
            grid-template-rows: 225px 350px 129px;
        }

        /* HEADER SELECTORS */
        header img {
            width: 500px;
        }
        header h1, h2 {
            color: white;
            text-shadow: 2px 2px black;
        }
        header h1 {
            position: absolute;
            top: 14%;
            width: 100%;
            text-align: center;
            font-size: 48px;
        }
        header h2 {
            position: absolute;
            top: 22%;
            width: 100%;
            text-align: center;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: .05em;
        }

        /* FORM SELECTORS */
        #formContainer {
            background-color: white;
            padding: 16px;
        }
        #formContainer h3 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .forms {
            display: flex;
            margin-bottom: 20px;
        }
        .forms input {
           margin-left: auto;
           width: 50%;
        }
        .radio-form {
            display: flex;
        }
        .radio-form div {
            margin-left: auto;
            margin-right: 125px;
            margin-bottom: 20px;
        }
        .checkbox {
            justify-self: center;
            margin-bottom: 20px
        }
        .button {
            justify-self: center;
            margin-bottom: 20px;
        }
        #content #myForm #closeBtn {
            position: absolute;
            width: 30px;
            height: 25px;
            top: 15px;
            left: 15px;
        }

        /* FOOTER SELECTORS */
        footer {
            background-color: white;
        }
        footer img {
            height: 129px;
            width: auto;
        }
    </style>




</head>

<body>
    <div id="content">

        <header>
            <img src="images/jesus_feeds_5000.jpeg" alt="jesus feedings the 5000">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </header>

        <div id="formContainer">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
                <button type="button" id="closeBtn">X</button>
                <div class="forms">
                    <label for="username">User Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="forms">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="forms">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="radio-form">
                    <label>Gender:</label>
                    <div>
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female" required>
                        <label for="female">Female</label>
                    </div>
                </div>

                <section class="checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section class="checkbox">
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">I acknowledge the terms and conditions</label>
                </section>

                <section class="button">
                    <button type="submit">Submit</button>
                </section>
            </form>
        </div>

        <footer>
            <img src="images/old_testament.webp" alt="old testament">
            <img src="images/new_testament.webp" alt="new testament">
            <img src="images/book_of_mormon.webp" alt="book of mormon">
            <img src="images/doctrine_and_covenants.webp" alt="doctrine and covenants">
            <img src="images/pearl_of_great_price.webp" alt="pearl of great price">
        </footer>

    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
