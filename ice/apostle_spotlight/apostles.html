<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            margin: 0;
            padding: 50px;
            background-color: #E8ECED;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
        }
        #card {
            position: relative;
            margin: 0 100px;
            width: 100%;
            max-width: 2500px;
            box-sizing: border-box;

            border: 15px solid black;
            border-radius: 60px;
            overflow: hidden;
        }
        #background-image {
            position: absolute;
            z-index: -1;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #content {
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 80px;
            font-weight: normal;
            margin-bottom: 20px;
        }
        h1 a {
            color: inherit;
            text-decoration: none;
        }
        h1 a:hover {
            text-decoration: underline;
            color: rgb(71, 173, 210);
        }
        h1 a:visited {
            text-decoration: none;
        }
        #first-presidency {
            margin: 0 22%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-items: center;
            align-items: center;
        }
        #prophet {
            width: 350px;
        }
        .portrait img {
            aspect-ratio: 1 / 1;
            object-fit: cover;

            border: 20px solid white;
            border-radius: 50%;
        }
        .portrait img:hover {
            border: 20px solid rgb(71, 173, 210);
        }
        h3 {
            color: white;
            margin: 40px 0 10px;
            font-size: 60px;
            font-weight: normal;
        }
        h3 a {
            color: inherit;
            text-decoration: none;
        }
        h3 a:hover {
            text-decoration: underline;
            color: rgb(71, 173, 210);
        }
        h3 a:visited {
            text-decoration: none;
        }
        #twelve-apostles {
            margin: 0 22%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            justify-items: center;
        }
        #twelve-apostles img {
            width: 200px;
            margin: 0 0 70px;
        }


    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
    <div id="card">

        <img id="background-image" src="./images/christus.webp" alt="picture of christ">

        <div id="content">
            <h1><a href="https://www.churchofjesuschrist.org/learn/first-presidency?lang=eng" target="_blank">First Presidency</a></h1>

            <div id="first-presidency" class="portrait">
                <img src="./images/eyring.webp" alt="Henry B. Eyring">
                <img id="prophet" src="./images/oaks.webp" alt="Dallin H. Oaks">
                <img src="./images/christofferson.webp" alt="D. Todd Christofferson">
            </div>

            <h3><a href="https://www.churchofjesuschrist.org/learn/quorum-of-the-twelve-apostles?lang=eng" target="_blank">Quorum of the Twelve Apostles</a></h3>

            <div id="twelve-apostles" class="portrait">
                <img src="./images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
                <img src="./images/bednar.webp" alt="David A. Bednar">
                <img src="./images/cook.webp" alt="Quentin L. Cook">
                <img src="./images/anderson.webp" alt="Neil L. Andersen">
                <img src="./images/rasband.webp" alt="Ronald A. Rasband">
                <img src="./images/stevenson.webp" alt="Gary E. Stevenson">
                <img src="./images/renlund.webp" alt="Dale G. Renlund">
                <img src="./images/gong.webp" alt="Gerrit W. Gong">
                <img src="./images/soares.webp" alt="Ulisses Soares">
                <img src="./images/kearon.webp" alt="Patrick Kearon">
                <img src="./images/causse.webp" alt="Gerald Causse">
                <img src="./images/gilbert.webp" alt="Clark G. Gilbert">
            </div>
        </div>
    </div>
</body>
</html>
